server:
  port: 8080

spring:
  application:
    name: book-management-app

  datasource:
    url: jdbc:h2:mem:bookdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true


# ============================================================
# Spring Boot Actuator, Metrics and Tracing
# ============================================================
management:
  # ----------------------------------------------------------
  # Actuator Endpoints
  # ----------------------------------------------------------
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  # ----------------------------------------------------------
  # Health Endpoint
  # ----------------------------------------------------------
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  # ----------------------------------------------------------
  # Prometheus Metrics Export
  # ----------------------------------------------------------
  metrics:
    export:
      prometheus:
        enabled: true

  # ----------------------------------------------------------
  # Distributed Tracing
  # ----------------------------------------------------------
  tracing:
    sampling:
      probability: 1.0

  # ----------------------------------------------------------
  # OpenTelemetry OTLP Trace Export
  # Docker Compose service: otel-collector
  # OTLP HTTP receiver port: 4318
  # ----------------------------------------------------------
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

# ============================================================
# Logging Configuration
# ============================================================
logging:
  level:
    root: INFO
    com.bookstore: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [trace_id=%X{trace_id} span_id=%X{span_id}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [trace_id=%X{trace_id} span_id=%X{span_id}] %-5level %logger{36} - %msg%n"