global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  # Scrape Spring Boot application directly
  - job_name: 'book-management-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['book-management-app:8080']
